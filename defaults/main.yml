---
# mDNS reflector. Avahi runs as a pure reflector on a multi-homed host and
# repeats mDNS between the listed segments so clients in one VLAN discover
# AirPlay/Chromecast/HomeKit/printers in another. Nothing is published about
# the host itself, and nothing can be registered via D-Bus.
#
# Role no-ops unless explicitly enabled.
avahi_enabled: false

# Interfaces avahi binds to. The reflector repeats between exactly these, so
# leave out WAN, DMZ and anything attacker-reachable: reflected records leak
# hostnames and service types of every device in the other segments.
# Mandatory when avahi_reflector is true - with an empty list avahi would
# bind to every interface.
avahi_allow_interfaces: []
# Belt and braces: explicitly denied even if someone later empties the
# allow list. allow-interfaces takes precedence when both are set.
avahi_deny_interfaces: []

avahi_use_ipv4: true
avahi_use_ipv6: true

avahi_reflector: true

# Service types to reflect. Empty = reflect everything (including _ssh,
# _smb, _workstation and the hostname of every box). Matching is a substring
# match on PTR/SRV/TXT records; A/AAAA host records are always reflected so
# name resolution keeps working. Avahi >= 0.8.
avahi_reflect_filters: []

# Reflect between IPv4 and IPv6 (translate v4 mDNS to v6 and back). Off by
# default; only needed when a segment is single-stack.
avahi_reflect_ipv: false

# Publish host records (hostname.local, addresses, workstation). Off for a
# reflector: the router has no business advertising itself into IoT.
avahi_publish: false

avahi_cache_entries_max: 4096

# systemd-resolved has its own mDNS stack on the same port. It is off per
# link unless networkd/NM enables it, but pin it off so a later network
# stack change can't start a second responder on 5353.
avahi_resolved_disable_mdns: true

# ── mDNS names into unicast DNS ─────────────────────────────────────────────
# Dump avahi's cache (every host it has resolved on the allowed interfaces)
# into a hosts(5) file for a local DNS server. Pi-hole 6 reads everything in
# /etc/pihole/hosts/ and picks up changes by itself; dnsmasq takes the file
# via addn-hosts=. Clients without an mDNS resolver (Android, containers,
# scripts) then resolve `foo.local` through plain DNS.
avahi_hosts_file_enabled: false
avahi_hosts_file_path: /etc/pihole/hosts/avahi.list
# Every host is also listed under these zones, e.g. mdns.example.net gives
# `sonos-abc.mdns.example.net`. Needed for clients that refuse to send
# `.local` to DNS at all (systemd-resolved answers it locally with NXDOMAIN).
avahi_hosts_file_domains: []
avahi_hosts_file_ipv6: true
avahi_hosts_file_interval: 1min
# Run after the file changed, for DNS servers that do not watch it
# (e.g. "pihole reloaddns" on Pi-hole 5, "systemctl reload dnsmasq").
avahi_hosts_file_reload_command: ""
