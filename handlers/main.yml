---
- name: Restart avahi
  ansible.builtin.systemd:
    name: avahi-daemon.service
    state: restarted

- name: Restart systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved.service
    state: restarted

- name: Restart avahi-hosts timer
  ansible.builtin.systemd:
    name: avahi-hosts.timer
    state: restarted
    daemon_reload: true

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
